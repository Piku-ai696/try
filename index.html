<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

  <title>CDN Request Tester</title>  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .box {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
    }

    input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      display: inline-block;
      padding: 14px 25px;
      border: none;
      border-radius: 6px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    button:active {
      transform: scale(0.98);
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      background: #eee;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #response {
      margin-top: 15px;
      padding: 15px;
      background: #111;
      color: white;
      min-height: 100px;
      white-space: pre-wrap;
      word-break: break-word;
      overflow: auto;
      max-height: 600px;
      font-family: monospace;
    }
  </style></head><body><div class="box">  <h2>CDN Request Tester</h2>  <p>
    Paste either an M3U8 playlist URL or a video segment URL.
  </p><input
id="targetUrl"
type="url"
placeholder="https://example.com/playlist.m3u8"

«»

<button
id="requestButton"
type="button"
onclick="sendRequest()"

«»

Send Request

  </button>  <div id="status">
    Ready — click Send Request.
  </div>  <pre id="response"></pre></div><script>

  /*
   * ================================
   * CUSTOM HEADER
   * ================================
   *
   * Change this for your test.
   *
   * Or use:
   *
   * const CUSTOM_HEADERS = {};
   */

  const CUSTOM_HEADERS = {
    "X-Custom-Header": "https://flixcloud.cc"
  };


  async function sendRequest() {

    /*
     * This happens immediately when the
     * button is clicked.
     *
     * If you see this, the button works.
     */

    const button = document.getElementById("requestButton");

    button.textContent = "CLICKED ✓";

    const status = document.getElementById("status");
    const responseBox = document.getElementById("response");
    const input = document.getElementById("targetUrl");

    status.textContent = "Button is working. Starting request...";
    responseBox.textContent = "";


    const url = input.value.trim();


    if (!url) {

      status.textContent =
        "Button works!\n\n" +
        "Please paste a target URL.";

      button.textContent = "Send Request";

      return;
    }


    /*
     * Check URL
     */

    try {
      new URL(url);
    } catch {

      status.textContent =
        "Button works!\n\n" +
        "Invalid URL.";

      button.textContent = "Send Request";

      return;
    }


    status.textContent =
      "Button works ✓\n\n" +
      "Sending request to:\n" +
      url;


    console.log("Target URL:", url);
    console.log("Custom headers:", CUSTOM_HEADERS);


    try {

      const response = await fetch(url, {

        method: "GET",

        headers: CUSTOM_HEADERS,

        credentials: "omit",

        cache: "no-store"

      });


      console.log("Response:", response);


      let responseHeaders = "";

      response.headers.forEach((value, key) => {

        responseHeaders +=
          key + ": " + value + "\n";

      });


      const contentType =
        response.headers.get("content-type") || "";


      /*
       * Playlist/text response
       */

      if (
        contentType.includes("text") ||
        contentType.includes("mpegurl") ||
        contentType.includes("json") ||
        url.toLowerCase().includes(".m3u8")
      ) {

        const text = await response.text();


        status.textContent =
          "SUCCESS ✓\n\n" +
          "HTTP: " +
          response.status +
          " " +
          response.statusText +
          "\n\n" +
          "Content-Type: " +
          contentType +
          "\n\n" +
          "Response headers:\n" +
          responseHeaders;


        responseBox.textContent = text;

      }

      /*
       * Binary segment response
       */

      else {

        const blob = await response.blob();


        status.textContent =
          "SUCCESS ✓\n\n" +
          "HTTP: " +
          response.status +
          " " +
          response.statusText +
          "\n\n" +
          "Content-Type: " +
          contentType +
          "\n\n" +
          "Size: " +
          blob.size.toLocaleString() +
          " bytes\n\n" +
          "Response headers:\n" +
          responseHeaders;


        responseBox.textContent =
          "Binary response received.\n\n" +
          "Content-Type: " +
          contentType +
          "\n" +
          "Size: " +
          blob.size.toLocaleString() +
          " bytes";
      }


    } catch (error) {

      console.error("Fetch error:", error);


      status.textContent =
        "BUTTON WORKS ✓\n\n" +
        "BUT REQUEST FAILED\n\n" +
        error.message;


      responseBox.textContent =
        "The browser did not expose the response.\n\n" +
        "Check DevTools → Network and Console.\n\n" +
        "If the request appears in Network but " +
        "JavaScript cannot read it, this is usually " +
        "a CORS restriction.";


    } finally {

      button.textContent = "Send Request";

    }

  }

</script></body>
</html>
